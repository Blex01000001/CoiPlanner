<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#222"/>
  <!-- 連線：由左側的兩個節點流向右側的節點 -->
  <path d="M26 20 C38 20 36 32 44 32 M26 44 C38 44 36 32 44 32" fill="none" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
  <!-- 節點：綠（運轉中）、黃（減產）、藍（啟動中），和畫布上的節點狀態色一致 -->
  <rect x="8" y="12" width="20" height="16" rx="4" fill="#4caf50"/>
  <rect x="8" y="36" width="20" height="16" rx="4" fill="#ffb300"/>
  <rect x="42" y="24" width="14" height="16" rx="4" fill="#4fc3f7"/>
</svg>
